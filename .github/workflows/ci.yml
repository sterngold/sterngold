name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      # gitleaks/gitleaks-action@v3
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: ci
    needs: [gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          # Allowlist, not denylist. A job that never got a runner reports
          # "abandoned", which a failure/cancelled check let through. Unconditional
          # gates must succeed; only a job with a job-level `if:` may be skipped.
          gate() {  # $1 = job, $2 = result, $3 = results it may have
            echo "$1=$2"
            case " $3 " in
              *" $2 "*) ;;
              *) echo "Upstream job $1 did not succeed: '${2}' (allowed: $3)"; exit 1 ;;
            esac
          }
          gate gitleaks "${{ needs.gitleaks.result }}" "success"
          echo "All required checks passed."
